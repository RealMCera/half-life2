name: Build Half-Life 1 Xbox 360 XEX probe (cloud, no local Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/half-life1-xbox-rebuild-prep-20261028
    paths:
      - .github/workflows/half-life1-x360-xex.yml
      - projects/half-life1-xbox/x360_probe/**
      - tests/test_x360_wireframe_host.py
      - tests/test_xenia_lut_diagnostic_patch.py
      - tools/patch_xsdk_xenia_lut_diagnostic.py

permissions:
  contents: read

concurrency:
  group: hl1-x360-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      XSDK_DIR: /tmp/hl1-xsdk
      XSDK_PREFIX: /tmp/hl1-xsdk-gcc
      XSDK_WORK: /tmp/hl1-xsdk-gcc-work
      PROBE_BUILD: /tmp/hl1-probe-build
      LUT_BUILD: /tmp/hl1-lut-probe-build

    steps:
      - name: Check out our original Half-Life 1 probe
        uses: actions/checkout@v4

      - name: Install build dependencies on GitHub runner (not the user's computer)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 cmake ninja-build git ca-certificates

      - name: Test original H360 CPU wireframe renderer using runner GCC
        run: python3 -m unittest discover -s tests -p 'test_x360_wireframe_host.py' -v

      - name: Test fail-closed LUT diagnostic patch
        run: python3 -m unittest discover -s tests -p 'test_xenia_lut_diagnostic_patch.py' -v

      - name: Fetch public open-source Xbox 360 SDK
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$XSDK_DIR"
          git -C "$XSDK_DIR" rev-parse HEAD | tee xsdk-upstream-commit.txt

      - name: Build PowerPC Xbox 360 cross-compiler on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$XSDK_DIR"
          PREFIX="$XSDK_PREFIX" WORK="$XSDK_WORK" JOBS=3 bash tools/toolchain/build.sh
          "$XSDK_PREFIX/bin/powerpc-xsdk-elf-gcc" --version

      - name: Build the SDK runtime library
        shell: bash
        run: |
          set -euo pipefail
          make -C "$XSDK_DIR" -j3 TOOLCHAIN="$XSDK_PREFIX/bin/powerpc-xsdk-elf-" build/libxsdk.a
          test -s "$XSDK_DIR/build/libxsdk.a"

      - name: Build H360 scene and Xenia display-compatibility XEX probes
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S projects/half-life1-xbox/x360_probe \
            -B "$PROBE_BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$XSDK_DIR/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$XSDK_PREFIX" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$PROBE_BUILD" --verbose
          test -s "$PROBE_BUILD/hl1_remaster_probe.xex"
          test -s "$PROBE_BUILD/hl1_display_probe.xex"

      - name: Build ISOLATED experimental Xenia LUT-timeout bypass probe
        shell: bash
        run: |
          set -euo pipefail
          # The untouched baseline display XEX was built in the previous step.
          # Modify only the disposable SDK checkout, and only the known
          # display.c timeout handling. Never use this patch on physical 360s.
          python3 tools/patch_xsdk_xenia_lut_diagnostic.py "$XSDK_DIR"
          make -C "$XSDK_DIR" -j3 TOOLCHAIN="$XSDK_PREFIX/bin/powerpc-xsdk-elf-" build/libxsdk.a
          cmake \
            -S projects/half-life1-xbox/x360_probe \
            -B "$LUT_BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$XSDK_DIR/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$XSDK_PREFIX" \
            -DHL1_EXPERIMENTAL_LUT_PROBE=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$LUT_BUILD" --target hl1_display_probe --verbose
          test -s "$LUT_BUILD/hl1_display_probe.xex"

      - name: Validate XEX2 file header and prepare download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          for name in ('hl1_remaster_probe.xex', 'hl1_display_probe.xex'):
              p = Path(__import__('os').environ['PROBE_BUILD']) / name
              with p.open('rb') as f:
                  header = f.read(4)
              if header != b'XEX2':
                  raise SystemExit(f'{name} is not XEX2: {header!r}')
              print(f'{name}: XEX2 header verified; {p.stat().st_size} bytes. Xenia startup is not verified by CI.')
          p = Path(__import__('os').environ['LUT_BUILD']) / 'hl1_display_probe.xex'
          if p.read_bytes()[:4] != b'XEX2':
              raise SystemExit('Experimental LUT probe is not XEX2')
          print('Experimental LUT bypass XEX2 header verified. Emulator startup UNTESTED.')
          PY
          cp "$PROBE_BUILD/hl1_remaster_probe.xex" dist/
          cp "$PROBE_BUILD/hl1_display_probe.xex" dist/
          cp "$LUT_BUILD/hl1_display_probe.xex" dist/hl1_display_lut_probe.xex
          cp xsdk-upstream-commit.txt dist/
          sha256sum dist/hl1_remaster_probe.xex dist/hl1_display_probe.xex dist/hl1_display_lut_probe.xex > dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          Half-Life 1 Xbox 360 native H360 scene and display probes.
          hl1_remaster_probe.xex: original map / BMP geometry preview.
          hl1_display_probe.xex: untouched SDK, known LUT timeout baseline.
          hl1_display_lut_probe.xex: EXPERIMENTAL and EMULATOR-ONLY.
          It uses a disposable SDK patch that ignores only the LUT
          autofill STATUS_IO_TIMEOUT so we can diagnose the NEXT display
          failure. This DOES NOT emulate LUT, guarantee a visible frame,
          or fix Xenia. NEVER RUN ON PHYSICAL XBOX 360 HARDWARE.
          Both display probes try separate ONE-FRAME kernel/GPU/720p
          display capability diagnostic, with NO game asset requirement.
          The display probe may only log RESULT_DISPLAY_UNAVAILABLE
          because the desktop Xenia build can reject xsdk present_open.
          The display probe title log is cache/hl1_display_probe.log.
          NOT A PLAYABLE GAME OR INTERACTIVE GRAPHICS REMASTER.
          When assets/hl1_c0a0_world.h360 is next to this XEX,
          it validates the entire H360 mesh and writes a CPU-generated
          640x360 top-down, isometric, and filled-shaded BMPs in cache:.
          Find that BMP under Xenia Canary's cache directory (not
          necessarily beside the XEX) after running in the emulator.
          Independently, the XEX always logs a 64x24 ASCII preview
          as HL1_WIRE lines, even if all BMP writes are blocked.
          The H360 title does not display live graphics in Xenia.
          The display title only attempts to present one solid color frame.
          Host-side synthetic H360 validation and native XEX compilation
          are tested in CI. Xenia behavior needs the user's real test.
          Download to Windows and try in Xenia Canary.
          Inspect Xenia cache title log and xenia.log for HL1_PROBE entries.
          No original Half-Life disc assets or SDK binaries are included.
          Xbox Series S Xenia UWP support is not confirmed.
          EOF
          cat dist/SHA256SUMS.txt

      - name: Upload Windows Xenia test XEX
        uses: actions/upload-artifact@v4
        with:
          name: HalfLife1-X360-XEX-StartupProbe
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload toolchain errors if compilation failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Xbox360-Cloud-Build-Failure-Logs
          path: /tmp/hl1-xsdk-gcc-work/logs/
          if-no-files-found: ignore
          retention-days: 7
